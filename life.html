<body class="life">

      <!-- the open middle (.gallery-window) is where the walk shows through; see viz.js -->
      <div class="gallery" data-walk>
        <figure class="snap" style="grid-area: a"><img src="assets/life/kyoto.jpg" alt="Under the torii gates at Fushimi Inari" loading="lazy"></figure>
        <figure class="snap" style="grid-area: b"><img src="assets/life/guangzhou.jpg" alt="Night skyline over the Pearl River" loading="lazy"></figure>
        <figure class="snap" style="grid-area: c"><img src="assets/life/gorge.jpg" alt="By a waterfall in a slate gorge" loading="lazy"></figure>
        <figure class="snap" style="grid-area: d"><img src="assets/life/flying.jpg" alt="In the cockpit of a small plane" loading="lazy"></figure>
        <figure class="snap" style="grid-area: e"><img src="assets/life/chongqing.jpg" alt="Hongyadong lit up at night" loading="lazy"></figure>
        <div class="gallery-window"><p class="window-quote"><span>the stochasticity of life is beautiful.</span></p></div>
        <figure class="snap" style="grid-area: f"><img src="assets/life/lecture.jpg" alt="Giving a lecture" loading="lazy"></figure>
        <figure class="snap" style="grid-area: g"><img src="assets/life/fishing.jpg" alt="Fishing off a pier at sunset" loading="lazy"></figure>
        <figure class="snap" style="grid-area: h"><img src="assets/life/canyon.jpg" alt="In a frozen canyon" loading="lazy"></figure>
        <figure class="snap" style="grid-area: i"><img src="assets/life/track.jpg" alt="In the blocks at a track meet" loading="lazy"></figure>

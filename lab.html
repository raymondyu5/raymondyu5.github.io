<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualization Lab</title>
  <meta name="robots" content="noindex">
  <script>
    // apply a saved light/dark choice before the page paints
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .lab figure { margin: 0 0 3rem; }
    .lab h2 { margin-top: 2.5rem; }
  </style>
</head>
<body>
  <div class="page lab">
    <header class="topbar">
      <a class="name" href="index.html">Visualization lab</a>
      <nav><a href="index.html">back</a> <button class="theme-toggle" type="button" aria-label="Toggle light and dark mode"></button></nav>
    </header>

    <h2>new · reveal</h2>
    <figure class="hero"><div class="viz" data-viz="reveal" data-image="assets/viz/starry.jpg" data-focus="0.15" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>new · murmur · rainier</h2>
    <figure class="hero"><div class="viz" data-viz="murmur" data-shape="rainier" data-image="assets/viz/rainier.jpg" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>new · journey</h2>
    <figure class="hero"><div class="viz" data-viz="journey" data-image="assets/viz/rainier.jpg" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>new · evolve</h2>
    <figure class="hero"><div class="viz" data-viz="evolve" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>new · murmur · grove</h2>
    <figure class="hero"><div class="viz" data-viz="murmur" data-shape="grove" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>new · murmur · landscape</h2>
    <figure class="hero"><div class="viz" data-viz="murmur" data-shape="landscape" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>new · murmur · tree</h2>
    <figure class="hero"><div class="viz" data-viz="murmur" data-shape="tree" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>new · stipple</h2>
    <figure class="hero"><div class="viz" data-viz="stipple" data-image="assets/viz/starry.jpg" data-focus="0.15" data-invert data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>01 · topo</h2>
    <figure class="hero"><div class="viz" data-viz="topo" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>02 · flock</h2>
    <figure class="hero"><div class="viz" data-viz="flock" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>03 · slime</h2>
    <figure class="hero"><div class="viz" data-viz="slime" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>04 · coral</h2>
    <figure class="hero"><div class="viz" data-viz="coral" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>

    <h2>05 · rain</h2>
    <figure class="hero"><div class="viz" data-viz="rain" data-height="200"></div><figcaption><span class="viz-caption"></span></figcaption></figure>
  </div>
  <script src="viz.js" defer></script>
  <script>
    // light/dark toggle: remembers the choice; the canvas recolours via 'themechange'
    (function () {
      const btn = document.querySelector('.theme-toggle'), root = document.documentElement;
      if (!btn) return;
      const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      const SUN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
      const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
      // show what you'd switch to: the sun in dark mode, the moon in light mode
      const label = () => { btn.innerHTML = dark() ? SUN : MOON; btn.setAttribute('aria-label', dark() ? 'Switch to light mode' : 'Switch to dark mode'); };
      btn.addEventListener('click', () => {
        root.dataset.theme = dark() ? 'light' : 'dark';
        try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
        label(); document.dispatchEvent(new Event('themechange'));
      });
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', label);
      label();
    })();
  </script>
</body>
</html>
